  <rect x="4" y="4" width="120" height="120" rx="28" fill="#15161a" stroke="#3a3d46" stroke-width="4"/>
  <rect x="20" y="31" width="54" height="16" rx="8" fill="#ffd302"/>
  <rect x="46" y="56" width="62" height="16" rx="8" fill="#ff5c8d"/>
